[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexvault-server"
version = "0.1.0"
description = "CortexVault API: FastAPI gateway, RAG pipeline, ingestion workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "httpx>=0.27",
    "openai>=1.55",
    "arq>=0.26",
    "redis>=5.2",
    "pgvector>=0.3",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "pillow>=11.0",
    "trafilatura>=1.12",
    "boto3>=1.35",
    "tiktoken>=0.8",
    "pyotp>=2.9",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

# Without this, flat-layout discovery sees app/, tests/, and alembic/ and refuses.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
# B008: Depends()/File() in argument defaults is the FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
