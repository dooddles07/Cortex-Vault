name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest

    services:
      # pgvector image, not stock Postgres: the initial migration creates the
      # vector extension and an HNSW index, so integration tests need it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install system dependencies
        # tesseract-ocr + poppler-utils back the OCR path (scanned PDFs and
        # images); without them extract_text falls back to needs_ocr, which
        # would silently hide OCR regressions from the test suite.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Audit dependencies
        # Advisory only: reports known CVEs without failing the build, since a
        # freshly-disclosed advisory in a transitive dep shouldn't block deploys.
        run: pip install pip-audit && pip-audit --skip-editable || true

      - name: Test
        # No provider keys: fake providers are autouse, so a test that reaches
        # for a real API fails here rather than silently spending quota.
        env:
          TEST_PG: postgres:postgres@localhost:5432
          JWT_SECRET: ci-secret
        # Report only, no --cov-fail-under: local runs skip integration tests
        # without Docker, so a coverage floor would be meaningless there and
        # noisy here — this just makes the number visible in CI logs.
        run: pytest -q --cov=app --cov-report=term-missing

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Advisory only, same rationale as the server job's pip-audit step.
        run: pnpm audit --audit-level=high || true

      - name: Typecheck
        run: pnpm --filter @cortexvault/web typecheck

      - name: Build
        # Inlined at build time, so it must be present here for the bundle to
        # be representative.
        env:
          NEXT_PUBLIC_API_URL: https://cortexvault-api.onrender.com
        run: pnpm --filter @cortexvault/web build
