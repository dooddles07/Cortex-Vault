name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest

    services:
      # pgvector image, not stock Postgres: the initial migration creates the
      # vector extension and an HNSW index, so integration tests need it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # No provider keys: fake providers are autouse, so a test that reaches
        # for a real API fails here rather than silently spending quota.
        env:
          TEST_PG: postgres:postgres@localhost:5432
          JWT_SECRET: ci-secret
        run: pytest -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @cortexvault/web typecheck

      - name: Build
        # Inlined at build time, so it must be present here for the bundle to
        # be representative.
        env:
          NEXT_PUBLIC_API_URL: https://api-production-84b56.up.railway.app
        run: pnpm --filter @cortexvault/web build
